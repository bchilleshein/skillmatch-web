      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado do ícone -->
  <rect width="60" height="60" rx="14" fill="url(#primaryGrad)" opacity="0.1" />
